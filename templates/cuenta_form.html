{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Editar cuenta bancaria</h3>
<form method="post" class="card p-4" style="max-width:640px">
  <p class="text-muted mb-3">Empleado: <b>{{ c.nombre }} {{ c.primer_apellido }} {{ c.segundo_apellido or '' }}</b></p>
  <div class="mb-3"><label class="form-label">Institucion (banco)</label>
    <select name="institucion" class="form-select">
      <option value="">-</option>
      {% for b in bancos %}<option {{ 'selected' if c.institucion==b }}>{{ b }}</option>{% endfor %}
    </select></div>
  <div class="mb-3"><label class="form-label">Tipo de cuenta</label>
    <select name="tipo_cuenta" class="form-select">
      <option value="">-</option>
      {% for t in tipos %}<option {{ 'selected' if c.tipo_cuenta==t }}>{{ t }}</option>{% endfor %}
    </select></div>
  <div class="mb-3"><label class="form-label">Numero</label>
    <input name="numero" class="form-control" value="{{ c.numero }}">
    <div class="form-text">No se permiten numeros duplicados.</div></div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary">Guardar cambios</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('cuentas') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
