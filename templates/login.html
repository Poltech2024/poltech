{% extends "base.html" %}
{% block title %}Entrar · Nomina Poltech{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="brand-bar"></div>
      <div class="card-body p-4 text-center">
        <img src="{{ url_for('static', filename='logo.jpeg') }}" style="height:90px" class="mb-3" alt="Poltech">
        <h4 class="mb-1 text-navy">Sistema de Nomina</h4>
        <p class="text-muted small mb-4">POLTECH Acero y Construccion</p>
        <form method="post" class="text-start">
          <label class="form-label">Usuario</label>
          <input name="username" class="form-control mb-3" autofocus required>
          <label class="form-label">Contrasena</label>
          <input name="password" type="password" class="form-control mb-4" required>
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
