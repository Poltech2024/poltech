{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h3 class="mb-3">Cambiar contrasena</h3>
    <div class="card p-4">
      <form method="post">
        <label class="form-label">Contrasena actual</label>
        <input name="actual" type="password" class="form-control mb-3" required>
        <label class="form-label">Nueva contrasena</label>
        <input name="nueva" type="password" class="form-control mb-4" required>
        <button class="btn btn-primary w-100">Guardar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
